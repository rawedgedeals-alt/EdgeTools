name: EdgeTools daily provider monitoring
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check listed provider URLs
        run: python scripts/check_providers.py
      - name: Avoid unnecessary Vercel builds for timestamp-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git show HEAD:monitor-status.json > /tmp/old-provider-report.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          previous=json.loads(Path('/tmp/old-provider-report.json').read_text())
          latest=json.loads(Path('monitor-status.json').read_text())
          if previous.get('providers')==latest.get('providers'):
              Path('monitor-status.json').write_text(json.dumps(previous,indent=2)+'\\n')
              print('No provider change. Skipping versioned status update.')
          PY
          fi
      - name: Publish check report
        run: |
          git config user.name "EdgeTools Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily provider link monitoring report"
            git push
          fi
