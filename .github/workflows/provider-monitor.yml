name: EdgeTools daily provider monitoring
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check listed provider URLs
        run: python scripts/check_providers.py
      - name: Publish check report
        run: |
          git config user.name "EdgeTools Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily provider link monitoring report"
            git push
          fi
