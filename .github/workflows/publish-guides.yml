name: WHATIF Approved Guide Publisher
on:
  push:
    paths:
      - '.github/workflows/publish-guides.yml'
      - 'scripts/publish_guides.py'
      - 'content/evergreen-guides.json'
  schedule:
    - cron: '11 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whatif-approved-guide-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout WHATIF
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate and publish due editorially approved articles
        run: |
          python -m py_compile scripts/publish_guides.py
          python scripts/publish_guides.py
      - name: Validate generated pages and sitemap
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('.')
          sitemap=(root/'sitemap.xml').read_text()
          ET.fromstring(sitemap)
          items=json.loads((root/'content/evergreen-guides.json').read_text())
          slugs=set()
          for a in items:
              assert a['slug'] not in slugs
              slugs.add(a['slug'])
              assert len(a['summary'])>=70 and len(a['sections'])>=3
              assert a['tool_path'] in ('website-starter.html','software-stack-planner.html','software-cost-calculator.html')
          if (root/'learn/index.html').exists():
              assert 'learn/index.html' in sitemap
              for p in (root/'learn').glob('*.html'):
                  assert p.stat().st_size>1000, p
          print('WHATIF approved guides and valid sitemap checked.')
          PY
      - name: Commit only newly due pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "whatif-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -d learn; then git add -A -- learn sitemap.xml; fi
          if ! git diff --cached --quiet; then
            git commit -m "content: publish due approved WHATIF guides"
            git push origin "HEAD:main"
          fi
