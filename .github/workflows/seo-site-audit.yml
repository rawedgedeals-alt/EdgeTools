name: WHATIF Weekly SEO and Site Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '27 15 * * 1'
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit site and sitemap
        id: audit
        continue-on-error: true
        run: python scripts/site_audit.py

      - name: Keep one maintenance issue open only when the audit fails
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          title="WHATIF production SEO audit needs attention"
          existing="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "WHATIF production SEO audit needs attention") | .number' | head -n 1)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$AUDIT_OUTCOME" != "success" ]]; then
            if [[ -z "$existing" ]]; then
              gh issue create --title "$title" --body "An automated production check failed. Review the workflow log: $run_url\n\nThis alert stays open until a later successful check. No content, advertisements, or paid integrations are changed automatically."
            fi
          elif [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "Checks recovered: $run_url. Closing the maintenance alert."
            gh issue close "$existing" --reason completed
          fi
      - name: Preserve failed audit status
        if: steps.audit.outcome != 'success'
        run: exit 1
